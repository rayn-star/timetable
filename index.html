<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#292b27">
  <title>继续你的学习 · 我的课表</title>
  <style>
    :root{color-scheme:dark;font-family:"LXGW WenKai","KaiTi",serif;background:#292b27;color:#f2eddf}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 15% 10%,#4b4c3d,transparent 65%)}
    main{width:min(100%,570px)}.eyebrow{font:11px Arial,sans-serif;letter-spacing:.2em;color:#cdbd9c}.rule{width:44px;border:0;border-top:1px solid #ad9e7d;margin:28px 0}h1{font-weight:400;font-size:clamp(29px,7vw,40px);line-height:1.4;margin:0 0 20px}
    p{font-size:16px;line-height:1.8;color:#d1ccbd;margin:0 0 15px}.notice{border-left:2px solid #c7b38e;padding:8px 0 8px 18px;margin:25px 0;background:linear-gradient(90deg,#d8c8a50a,transparent)}.notice p{margin:0;font-size:14px}.notice.error{border-color:#f0b4a0}.actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
    button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border:1px solid #d8c8a5;padding:11px 20px;font:16px "LXGW WenKai","KaiTi",serif;cursor:pointer;text-decoration:none;background:#d8c8a5;color:#292b27}.button.secondary{background:transparent;color:#ece4d2;border-color:#8b8977}button:hover{background:#ecdfbd}.button.secondary:hover{background:#ffffff0b}
    button:focus-visible,a:focus-visible{outline:2px solid #eadbbb;outline-offset:5px}.fine{font-size:12px;color:#aaa99c;margin-top:27px}footer{margin-top:48px;font:10px Georgia,serif;color:#b6ac96;letter-spacing:.08em}#feedback{min-height:24px;font-size:13px;color:#d8c8a5;margin-top:15px}code{font:12px ui-monospace,monospace;overflow-wrap:anywhere}
    @media(max-width:420px){body{padding:24px}.actions{flex-direction:column}button,.button{width:100%}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">MY TIMETABLE · A NEW CHAPTER</p>
    <hr class="rule">
    <h1 id="heading">正在前往新版课表…</h1>
    <p id="intro">新版已加入登录首页，让学习从这里继续。</p>
    <section id="migration" hidden aria-label="保存旧课表">
      <div class="notice" id="notice"><p id="summary"></p></div>
      <p id="instructions">先下载备份，再进入新版。登录后点击课表右上角「导入」，选择刚下载的 JSON 文件即可。</p>
      <div class="actions">
        <button id="download" type="button">下载旧课表备份 ↓</button>
        <a class="button secondary" href="https://rayn-timetable-athens.vercel.app/">进入新版 ↗</a>
      </div>
      <p id="feedback" role="status" aria-live="polite"></p>
      <p class="fine">旧数据只在这个浏览器中读取和下载，不会自动上传，也不会被删除。你可以随时回来继续备份。新版使用新的网址，无法直接读取旧网址保存的数据。</p>
    </section>
    <p id="fallback"><a class="button secondary" href="https://rayn-timetable-athens.vercel.app/">直接进入新版 ↗</a></p>
    <noscript><p>浏览器未启用 JavaScript，无法检查旧课表。若之前在这个浏览器保存过课程或待办，请先启用 JavaScript 并刷新本页，再下载备份。</p></noscript>
    <footer>Little by little, a little becomes a lot.</footer>
  </main>
  <script>
  'use strict';
  // @BACKUP_HELPERS_START
  function buildMigrationBackup(rawState,rawTerm,exportedAt=new Date().toISOString()) {
    const hasData=rawState!==null || rawTerm!==null;
    const errors=[];
    function parse(raw,key) {
      if(raw===null) return null;
      try {
        const value=JSON.parse(raw);
        if(!value || typeof value!=='object' || Array.isArray(value)) {
          errors.push(key+': 不是有效的数据对象'); return null;
        }
        return value;
      } catch {errors.push(key+': JSON 解析失败');return null;}
    }
    const state=parse(rawState,'timetable.v2');
    const term=parse(rawTerm,'timetable.term.v1');
    if(state) {
      if(!Array.isArray(state.courses)) errors.push('timetable.v2: courses 格式异常');
      if(!Array.isArray(state.todos)) errors.push('timetable.v2: todos 格式异常');
      if(!Number.isInteger(state.week)) errors.push('timetable.v2: week 格式异常');
    }
    if(term) {
      if(!Array.isArray(term.entries)) errors.push('timetable.term.v1: entries 格式异常');
      if(!term.meta || typeof term.meta!=='object' || Array.isArray(term.meta)) errors.push('timetable.term.v1: meta 格式异常');
    }
    const backup={
      app:'timetable',version:4,exportedAt,
      week:Number.isInteger(state?.week) ? state.week : null,
      courses:Array.isArray(state?.courses) ? state.courses : [],
      todos:Array.isArray(state?.todos) ? state.todos : [],
      term:rawTerm===null ? null : {entries:Array.isArray(term?.entries) ? term.entries : [],meta:term?.meta && typeof term.meta==='object' && !Array.isArray(term.meta) ? term.meta : {}}
    };
    if(errors.length) {
      // 保存两个键的完整原文，包含损坏的 JSON；不靠重序列化猜测或修复。
      backup.rawStorage={'timetable.v2':rawState,'timetable.term.v1':rawTerm};
      backup.recoveryErrors=errors;
    }
    return {hasData,recovery:errors.length>0,backup};
  }
  // @BACKUP_HELPERS_END
  (()=>{
    const destination='https://rayn-timetable-athens.vercel.app/';
    const $=id=>document.getElementById(id);
    let result;
    try {
      result=buildMigrationBackup(localStorage.getItem('timetable.v2'),localStorage.getItem('timetable.term.v1'));
    } catch {
      $('heading').textContent='先保留你的旧数据';
      $('intro').textContent='浏览器暂时不允许读取本地数据。如果这里有旧课表，请允许本站使用本地存储后刷新；也可以稍后再回来。';
      return;
    }
    if(!result.hasData) {location.replace(destination);return;}
    $('heading').textContent='把积累，带到新的地方。';
    $('intro').textContent='这个浏览器里还有你的旧课表。花一点时间保存下来，就能在新版继续使用。';
    $('migration').hidden=false;
    $('fallback').hidden=true;
    const backup=result.backup;
    $('summary').textContent=`检测到 ${backup.courses.length} 条课程、${backup.todos.length} 条待办，以及 ${backup.term?.entries.length || 0} 条学期课程记录。`;
    if(result.recovery) {
      $('notice').classList.add('error');
      $('summary').textContent='部分旧数据的格式异常，但完整原文仍然可以保存。请先下载恢复备份。';
      $('instructions').textContent='恢复备份包含两个存储键的完整原文。请保留这个文件，修复后再导入；不要覆盖或清除旧浏览器数据。';
      $('download').textContent='下载完整恢复备份 ↓';
    }
    $('download').addEventListener('click',()=>{
      try {
        // 每次点击重新读取，避免另一个旧标签页更新数据后只导出过时快照。
        const current=buildMigrationBackup(localStorage.getItem('timetable.v2'),localStorage.getItem('timetable.term.v1'));
        if(!current.hasData) {$('feedback').textContent='未找到可备份的数据。未删除或更改任何本地记录。';return;}
        const blob=new Blob([JSON.stringify(current.backup,null,2)],{type:'application/json;charset=utf-8'});
        const url=URL.createObjectURL(blob);
        const link=document.createElement('a');
        link.href=url;
        link.download=`课表-${current.recovery?'恢复备份':'迁移备份'}-${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(link);link.click();link.remove();
        setTimeout(()=>URL.revokeObjectURL(url),60000);
        $('feedback').textContent=current.recovery ? '已发起恢复备份下载。请确认文件已保存，旧数据仍保留。' : '已发起备份下载。确认文件保存后，即可进入新版导入。';
      } catch {$('feedback').textContent='暂时无法生成备份。请保留此页，允许本地存储和文件下载后重试。';}
    });
  })();
  </script>
</body>
</html>
