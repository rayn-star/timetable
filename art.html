<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审美日历</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css">
<style>
  :root {
    --ink: #1b1b1d;
    --sub: #7a7770;
    --line: #e4e1da;
    --bg: #faf8f4;
    --paper: #fffdf9;
    --accent: #2f6b4f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "LXGW WenKai", -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 28px 64px; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 34px;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 2px; }
  header .back {
    font-size: 12.5px;
    color: var(--sub);
    text-decoration: none;
  }
  header .back:hover { color: var(--accent); }

  .entry { display: grid; grid-template-columns: 1.05fr 1fr; gap: 44px; align-items: start; }
  figure { margin: 0; }
  figure img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 3px;
    background: #eee;
  }
  figcaption {
    margin-top: 10px;
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--sub);
  }

  .date {
    font-size: 12px;
    letter-spacing: 1.5px;
    color: var(--sub);
    margin-bottom: 16px;
  }
  h2 {
    margin: 0 0 20px;
    font-family: "LXGW WenKai", "Songti SC", "Noto Serif SC", "SimSun", serif;
    font-size: 30px;
    line-height: 1.45;
    font-weight: 600;
    letter-spacing: .5px;
  }
  .body {
    font-family: "LXGW WenKai", "Songti SC", "Noto Serif SC", "SimSun", serif;
    font-size: 16.5px;
    line-height: 2.05;
    color: #2a2a2b;
  }
  .body p { margin: 0 0 1.1em; }
  .body p:last-child { margin-bottom: 0; }

  nav {
    margin-top: 44px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  nav button {
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
  }
  nav button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  nav button:disabled { opacity: .35; cursor: default; }

  .empty { color: var(--sub); font-size: 14px; line-height: 1.9; }

  @media (max-width: 820px) {
    .wrap { padding: 26px 18px 48px; }
    .entry { grid-template-columns: 1fr; gap: 22px; }
    h2 { font-size: 24px; margin-bottom: 14px; }
    .body { font-size: 15.5px; line-height: 1.95; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>审美日历</h1>
    <a class="back" href="index.html">← 回到课表</a>
  </header>

  <main id="main"></main>
</div>

<script>
(function () {
  let entries = [];
  let idx = 0;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
  }

  function fmtDate(d) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
    if (!m) return d || '';
    return m[1] + '.' + m[2] + '.' + m[3];
  }

  function paragraphs(text) {
    return String(text || '').split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('');
  }

  function render() {
    const main = document.getElementById('main');
    if (!entries.length) {
      main.innerHTML = '<p class="empty">还没有内容。每天发我三样东西：主题、正文、一张图。</p>';
      return;
    }
    const e = entries[idx];
    main.innerHTML =
      '<article class="entry">'
      + '<figure>'
      + (e.image ? '<img src="' + esc(e.image) + '" alt="' + esc(e.theme) + '">' : '')
      + ((e.caption || e.source) ? '<figcaption>' + esc(e.caption || '') + (e.source ? (e.caption ? '<br>' : '') + esc(e.source) : '') + '</figcaption>' : '')
      + '</figure>'
      + '<div>'
      + '<div class="date">' + esc(fmtDate(e.date)) + '</div>'
      + '<h2>' + esc(e.theme) + '</h2>'
      + '<div class="body">' + paragraphs(e.content) + '</div>'
      + '</div>'
      + '</article>'
      + '<nav>'
      + '<button id="prev" ' + (idx <= 0 ? 'disabled' : '') + '>‹ 前一天</button>'
      + '<button id="next" ' + (idx >= entries.length - 1 ? 'disabled' : '') + '>后一天 ›</button>'
      + '</nav>';

    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    if (prev) prev.addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
    if (next) next.addEventListener('click', () => { if (idx < entries.length - 1) { idx++; render(); } });
  }

  function todayStr() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  fetch('entries.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('no entries.json')))
    .then(list => {
      entries = (Array.isArray(list) ? list : []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
      const t = todayStr();
      let i = entries.findIndex(e => e.date === t);
      if (i < 0) i = entries.length - 1;   // 今天还没写，就显示最近一条
      idx = Math.max(0, i);
      render();
    })
    .catch(() => {
      document.getElementById('main').innerHTML = '<p class="empty">还没读到 entries.json。</p>';
    });
})();
</script>
</body>
</html>
